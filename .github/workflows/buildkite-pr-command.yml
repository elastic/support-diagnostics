# Lets a maintainer run Buildkite CI on a pull request on demand -- including fork
# PRs, which Buildkite won't build automatically -- by commenting
# "buildkite test this <sha>", naming the exact full 40-character commit SHA to build.
# The named commit must exactly match the PR's current head; this pins the exact
# tree that gets built regardless of any later push.
# Only commenters with write access can trigger it; no fork code runs here (REST API only).
# Requires a repo secret BUILDKITE_API_TOKEN scoped to `write_builds`.
name: "Buildkite: build this PR on demand"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  buildkite-test-this:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'buildkite test this')
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write access
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          level=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$level" in
            admin|write|maintain) ;;
            *) echo "::error::@${ACTOR} lacks write access (permission: ${level})"; exit 1 ;;
          esac

      - name: Resolve and validate requested commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: |
          # The maintainer must name the commit explicitly: "buildkite test this <sha>".
          # We require the full 40-character SHA so the comment uniquely identifies
          # a commit; shorter abbreviations can be brute-forced to collide.
          if [[ "$COMMENT_BODY" =~ buildkite[[:space:]]+test[[:space:]]+this[[:space:]]+([0-9a-fA-F]{40})([^0-9a-fA-F]|$) ]]; then
            REQUESTED="${BASH_REMATCH[1],,}"
          else
            echo "::error::Comment must be 'buildkite test this <sha>' with the FULL 40-character commit hash."
            exit 1
          fi

          # Resolve the PR head SHA and head repo SSH URL (for fork builds).
          read -r HEAD_SHA HEAD_REPO < <(
            gh api "repos/${REPO}/pulls/${PR}" \
              --jq '[.head.sha, (.head.repo.ssh_url // "")] | @tsv'
          )

          # The requested hash must exactly match the current PR head.
          # A commit pushed after the comment has a different SHA and fails here.
          if [ "$HEAD_SHA" != "$REQUESTED" ]; then
            echo "::error::Requested commit ${REQUESTED} does not match the current PR head ${HEAD_SHA}."
            echo "::error::Re-comment with: buildkite test this ${HEAD_SHA}"
            exit 1
          fi

          # No push-time check: the Events API returns nothing for forks
          # (repos/<fork>/events is always []), which is the case this workflow exists to
          # serve. Requiring the full 40-char SHA and matching it against the live PR head
          # pins the exact tree instead -- a commit pushed after the comment has a
          # different SHA and fails the check above.

          {
            echo "sha=${HEAD_SHA}"
            echo "repo=${HEAD_REPO}"
          } >>"$GITHUB_OUTPUT"

      - name: Trigger Buildkite build
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
        run: |
          # Passing the resolved SHA up front -- instead of the literal string "HEAD" --
          # lets Buildkite link the build to the PR immediately, rather than only once
          # the build finishes and Buildkite resolves the commit itself.
          #
          # pull_request_repository is only included for same-repo PRs: Buildkite returns
          # 404 when given a fork SSH URL (it has no pipeline configured for the fork),
          # but it can still check out refs/pull/<PR>/head from its configured repo
          # because GitHub creates that ref in the base repo for all PRs including forks.
          if [[ "$HEAD_REPO" == *":${REPO}"* ]]; then
            REPO_ARG=",\"pull_request_repository\":\"${HEAD_REPO}\""
          else
            REPO_ARG=""
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${BUILDKITE_API_TOKEN}" \
            "https://api.buildkite.com/v2/organizations/elastic/pipelines/support-diagnostics/builds" \
            -d "{\"commit\":\"${SHA}\",\"branch\":\"refs/pull/${PR}/head\",\"pull_request_id\":${PR},\"pull_request_base_branch\":\"main\"${REPO_ARG}}"
